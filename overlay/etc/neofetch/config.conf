# ghOSt-RG35XXH neofetch config
# Uses logo via chafa (renders image as unicode block art in terminal)

print_info() {
    info title
    info underline
    info "OS"         distro
    info "Branch"     model
    info "Kernel"     kernel
    info "Uptime"     uptime
    info "Packages"   packages
    info "Shell"      shell
    info "Resolution" resolution
    info "WM"         wm
    info "Theme"      theme
    info "CPU"        cpu
    info "GPU"        gpu
    info "Memory"     memory
    info "Disk"       disk
    prin ""
    info cols
}

# Use logo via chafa instead of ascii art
image_backend="chafa"
image_source="/opt/ghost/assets/logo-128.png"
image_size="128px"
gap=2

# Colors — match cybersec theme defaults
colors=(6 6 6 6 6 6)
bold=on
underline_enabled=on
underline_char="─"
separator=" ▶"

# Custom title
title_fqdn=off

# Model — show branch name
model_name="ghOSt-RG35XXH"
