# ghOSt DOSBox-X Configuration
# Themed for cyberpunk/hacker DOS nostalgia

[sdl]
fullscreen=true
fulldouble=false
fullresolution=640x480
windowresolution=640x480
output=opengl
hwscale=false
autolock=true
sensitivity=100
waitonerror=true
priority=higher,normal
mapperfile=mapper.map
usescancodes=true

[dosbox]
language=
machine=svga_s3
captures=capture
memsize=64

[render]
frameskip=0
aspect=true
scaler=normal3x

[cpu]
core=auto
cputype=auto
cycles=auto
cycleup=10
cycledown=20

[mixer]
nosound=false
rate=44100
blocksize=1024
prebuffer=20

[midi]
mpu401=intelligent
mididevice=default

[sblaster]
sbtype=sb16
sbbase=220
irq=7
dma=1
hdma=5
sbmixer=true
oplmode=auto
oplemu=default
oplrate=44100

[gus]
gus=false

[speaker]
pcspeaker=true
pcrate=44100
tandy=auto
tandyrate=44100
disney=false

[joystick]
joysticktype=auto

[serial]
serial1=dummy
serial2=dummy
serial3=disabled
serial4=disabled

[dos]
xms=true
ems=true
umb=true
keyboardlayout=auto

[autoexec]
# ghOSt DOS Environment - Cyberpunk themed
@echo off
cls
color 0A
echo.
echo  ______  __  __  ______  ______  ______
echo /\  ___\/\ \_\ \/\  __ \/\  ___\/\__  _\
echo \ \ \__ \ \  __ \ \ \/\ \ \___  \/_/\ \/
echo  \ \_____\ \_\ \_\ \_____\/\_____\ \ \_\
echo   \/_____/\/_/\/_/\/_____/\/_____/  \/_/
echo.
echo  Handheld Security and Signal Terminal
echo  DOS Environment - $(date)
echo.
echo  Available:
echo    HACKER   - Hacker I (1985)
echo    HACKER2  - Hacker II (1986)
echo    NEURO    - Neuromancer (1988)
echo    SHOCK    - System Shock Demo
echo    SATAN    - Security Analysis Tool (1995)
echo    TONELOC  - War Dialer (1994)
echo    CRACK    - Password Cracker Demo
echo.
echo  Type any name above to launch. Type EXIT to quit.
echo.
prompt $P$G
PATH C:\DOS;C:\GAMES;C:\TOOLS;%PATH%
SET BLASTER=A220 I7 D1 H5 P330 T6
